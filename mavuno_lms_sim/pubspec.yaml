name: mavuno_lms_sim
description: >-
  Simulated Livestock Monitoring System (LMS) that tracks a Mavuno herd with
  virtual farm cameras and sends synthetic appetite, activity and behaviour
  notes to a local Mavuno server.
publish_to: none

environment:
  sdk: '^3.12.2'

# Deliberately not a member of the Mavuno workspace, so adding the simulator
# leaves the workspace pubspec.yaml and pubspec.lock untouched.

dependencies:
  mavuno_client:
    path: ../mavuno_client
  serverpod_auth_core_client: 4.0.0
  serverpod_client: 4.0.0
  yaml: ^3.1.3

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5
