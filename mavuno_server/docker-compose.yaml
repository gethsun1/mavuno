services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mavuno
      POSTGRES_PASSWORD: "7ts_DcNAcRXDi2aldCT_ttDoFCuOlq2q"
    volumes:
      - mavuno_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "29E4bvKDcPaOsulItIPb2sNMBpgNRtps"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mavuno_test
      POSTGRES_PASSWORD: "nYsOKGHjKXjMMarC1pjSfDXvb0jO7L_i"
    volumes:
      - mavuno_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "-bohR6QBcnBK-2eOVrYKR6K4BjlQOdql"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  mavuno_data:
  mavuno_test_data:
