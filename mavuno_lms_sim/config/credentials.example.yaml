# Copy this file to config/credentials.yaml (ignored by git) and fill in the
# local Mavuno farmer account the simulator should sign in as.

# The local Mavuno API started by `serverpod start`. Only localhost is allowed.
serverUrl: http://localhost:8080/

email: farmer@example.com
# Keep the password in quotes.
password: 'your-local-password'

# Optional. Defaults to the account's first farm, the farm the Mavuno app shows.
# farmId: 1
